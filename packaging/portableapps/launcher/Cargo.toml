[package]
name = "limbo-portable-launcher"
description = "LimboPortable.exe: starts Limbo from a PortableApps.com Format package with its data in the package's Data folder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "LimboPortable"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"
