name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (Rust, any OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p limbo-core --all-targets -- -D warnings
      - run: cargo test -p limbo-core
      # Phase 4 gate: local suggestions <= 30 ms with 100k history rows. The gate
      # is defined on the owner's laptop; on shared CI runners it's informational.
      - run: cargo test -p limbo-core --release -- --ignored suggestions_are_fast
        continue-on-error: true

  ui:
    name: UI (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Fails when the bundle exceeds 150 KB JS / 40 KB CSS (gzip).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: ui/test-results

  windows:
    name: Windows host and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo clippy -p limbo --all-targets -- -D warnings
      - run: cargo test -p limbo
      - name: Check measure-memory.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\measure-memory.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Build installer
        run: npm run tauri -- build
        working-directory: ui
      - name: Check installer size (<= 10 MB)
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB, 2)
          "Installer: $($exe.Name) $mb MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($exe.Length -gt 10MB) { Write-Error "Installer is over 10 MB"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: limbo-installer
          path: target/release/bundle/nsis/*.exe

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (rsa, Marvin attack) concerns private-key operations;
      # Limbo only verifies CRX signatures with public keys. See docs/DECISIONS.md.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - run: npm audit --audit-level=high
        working-directory: ui
