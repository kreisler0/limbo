name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (Rust, any OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p limbo-core -p limbo-portable-launcher --all-targets -- -D warnings
      - run: cargo test -p limbo-core -p limbo-portable-launcher
      # Phase 4 gate: local suggestions <= 30 ms with 100k history rows. The gate
      # is defined on the owner's laptop; on shared CI runners it's informational.
      - run: cargo test -p limbo-core --release -- --ignored suggestions_are_fast
        continue-on-error: true

  ui:
    name: UI (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Fails when the bundle exceeds 150 KB JS / 40 KB CSS (gzip).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: ui/test-results

  windows:
    name: Windows host and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo clippy -p limbo -p limbo-portable-launcher --all-targets -- -D warnings
      - run: cargo test -p limbo -p limbo-portable-launcher
      - name: Check measure-memory.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\measure-memory.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Build installer
        run: npm run tauri -- build
        working-directory: ui
      - name: Check installer size (<= 10 MB)
        shell: pwsh
        run: |
          $exe = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB, 2)
          "Installer: $($exe.Name) $mb MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($exe.Length -gt 10MB) { Write-Error "Installer is over 10 MB"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: limbo-installer
          path: target/release/bundle/nsis/*.exe

      # --- PortableApps.com Format package ---------------------------------------------------------
      - name: Build the portable launcher
        run: cargo build --release -p limbo-portable-launcher
      - name: Assemble LimboPortable (PortableApps.com Format)
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          Remove-Item -Recurse -Force dist-portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory dist-portable | Out-Null
          $pkg = "dist-portable\LimboPortable"
          Copy-Item -Recurse packaging\portableapps\LimboPortable $pkg
          New-Item -ItemType Directory -Force "$pkg\App\Limbo" | Out-Null
          Copy-Item target\release\limbo.exe "$pkg\App\Limbo\Limbo.exe"
          Copy-Item target\release\LimboPortable.exe "$pkg\LimboPortable.exe"
          $ini = "$pkg\App\AppInfo\appinfo.ini"
          $text = (Get-Content $ini -Raw).Replace('@PACKAGE_VERSION@', "$version.0").Replace('@DISPLAY_VERSION@', $version)
          [System.IO.File]::WriteAllText((Resolve-Path $ini), $text)
          if ((Get-Content $ini -Raw) -match '@') { Write-Error "appinfo.ini still has placeholders"; exit 1 }
          Get-ChildItem -Recurse -File $pkg | ForEach-Object { '{0,10:N0}  {1}' -f $_.Length, $_.FullName.Substring((Resolve-Path $pkg).Path.Length) }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Smoke-test the launcher (missing app is reported, not crashed)
        shell: pwsh
        run: |
          # A copy without App\Limbo must report the problem (an error dialog, closed here by the timeout)
          # and must not create a Data folder.
          $t = "dist-portable\launcher-test"
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item target\release\LimboPortable.exe $t
          $p = Start-Process "$t\LimboPortable.exe" -PassThru
          if (-not $p.WaitForExit(3000)) { $p.Kill() }  # waiting on the error dialog is the expected path
          if (Test-Path "$t\Data") { Write-Error "launcher created Data without the app"; exit 1 }
          Remove-Item -Recurse -Force $t
      - uses: actions/upload-artifact@v4
        with:
          name: limbo-portable-folder
          path: dist-portable/LimboPortable
      # The official PortableApps.com Installer turns the folder into LimboPortable_x.y.z.paf.exe.
      # It's downloaded from portableapps.com at build time; if that fails, the folder above is
      # still a complete package (copy it into the Platform's PortableApps folder).
      - name: Build LimboPortable .paf.exe (PortableApps.com Installer)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $page = (Invoke-WebRequest https://portableapps.com/apps/development/portableapps.com_installer -UseBasicParsing).Content
          $file = [regex]::Match($page, 'PortableApps\.comInstaller_[0-9][0-9.]*(_[A-Za-z]+)?\.paf\.exe').Value
          if (-not $file) { throw "PortableApps.com Installer download not found on its page" }
          "PortableApps.com Installer: $file"
          $tools = "$env:RUNNER_TEMP\pa-tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          $dl = "$tools\$file"
          $urls = @(
            "https://portableapps.com/redirect/?a=PortableApps.comInstaller&s=s&d=sfpa&f=$file",
            "https://downloads.sourceforge.net/project/portableapps/PortableApps.com%20Installer/$file"
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest $u -OutFile $dl -UseBasicParsing -MaximumRedirection 10
              $head = [System.IO.File]::ReadAllBytes($dl)[0..1]
              if ((Get-Item $dl).Length -gt 500KB -and $head[0] -eq 0x4D -and $head[1] -eq 0x5A) { "Downloaded from $u"; break }
            } catch { "Download failed from ${u}: $_" }
            Remove-Item $dl -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $dl)) { throw "couldn't download $file" }
          # A .paf.exe is an NSIS installer; 7-Zip unpacks it without running it.
          & 7z x $dl "-o$tools\Installer" -y | Out-Null
          $exe = Get-ChildItem -Recurse "$tools\Installer" -Filter PortableApps.comInstaller.exe | Select-Object -First 1
          if (-not $exe) { throw "PortableApps.comInstaller.exe not found after unpacking" }
          $pkg = (Resolve-Path dist-portable\LimboPortable).Path
          $p = Start-Process $exe.FullName -ArgumentList "`"$pkg`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "PortableApps.com Installer timed out" }
          $paf = Get-ChildItem dist-portable -Filter *.paf.exe | Select-Object -First 1
          if (-not $paf) {
            Get-ChildItem -Recurse $pkg -Filter *.txt | Where-Object Name -like '*Log*' | ForEach-Object { Get-Content $_.FullName }
            throw "no .paf.exe was produced"
          }
          "Built $($paf.Name): $([math]::Round($paf.Length / 1MB, 2)) MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: limbo-portable-paf
          path: dist-portable/*.paf.exe
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (rsa, Marvin attack) concerns private-key operations;
      # Limbo only verifies CRX signatures with public keys. See docs/DECISIONS.md.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - run: npm audit --audit-level=high
        working-directory: ui
